name: Refresh and deploy dashboard

on:
  schedule:
    # Best-effort: GitHub throttles high-frequency schedules on public repos.
    - cron: '0 */6 * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - id: pages
        uses: actions/configure-pages@v5

      - name: Build fixtures
        env:
          # Optional: set a FOOTBALL_DATA_TOKEN repo secret (free key from
          # football-data.org) to pull live fixtures. Without it (or if the
          # live fetch fails), this falls back to demo data and still succeeds.
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: node scripts/refresh.mjs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

      - id: deployment
        uses: actions/deploy-pages@v4
