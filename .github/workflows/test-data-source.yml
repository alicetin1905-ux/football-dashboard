name: Test data source

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe-sportapi7:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe sportapi7.p.rapidapi.com
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: |
          echo "== known event by id (host+key sanity check) =="
          curl -s -o /tmp/r1.json -w "HTTP %{http_code}\n" \
            -H "x-rapidapi-key: $RAPIDAPI_KEY" -H "x-rapidapi-host: sportapi7.p.rapidapi.com" \
            "https://sportapi7.p.rapidapi.com/api/v1/event/7881945"
          head -c 300 /tmp/r1.json; echo

          echo "== scheduled events today (list endpoint candidate) =="
          TODAY=$(date -u +%Y-%m-%d)
          curl -s -o /tmp/r2.json -w "HTTP %{http_code}\n" \
            -H "x-rapidapi-key: $RAPIDAPI_KEY" -H "x-rapidapi-host: sportapi7.p.rapidapi.com" \
            "https://sportapi7.p.rapidapi.com/api/v1/sport/football/scheduled-events/$TODAY"
          head -c 500 /tmp/r2.json; echo

  test-refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run refresh
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: |
          echo "RAPIDAPI_KEY is set: $([ -n "$RAPIDAPI_KEY" ] && echo yes || echo no)"
          node scripts/refresh.mjs

      - name: Report result
        run: |
          node -e '
            const d = require("./docs/data/fixtures.json");
            console.log("source:", d.source);
            console.log("fixture count:", d.fixtures.length);
            console.log("sample:", JSON.stringify(d.fixtures.slice(0, 3).map(f => ({
              league: f.league, home: f.home.name, away: f.away.name, date: f.date, combined: f.score.combined,
            })), null, 2));
          '
