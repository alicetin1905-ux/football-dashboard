name: Test data source

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-historical-season:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Fetch season 2024 fixtures directly (proves auth + data shape)
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: |
          check() {
            echo "== $1 =="
            curl -s -o /tmp/hist.json -w "HTTP %{http_code}\n" -H "x-apisports-key: $RAPIDAPI_KEY" "$2"
            node -e '
              const d = require("/tmp/hist.json");
              console.log("results:", d.results, "errors:", JSON.stringify(d.errors));
              for (const r of (d.response || []).slice(0, 5)) {
                console.log(r.fixture.date, r.teams.home.name, r.goals.home, "-", r.goals.away, r.teams.away.name);
              }
            '
            sleep 1
          }

          check "date range, Aug 2024" "https://v3.football.api-sports.io/fixtures?league=39&season=2024&from=2024-08-01&to=2024-08-31"
          check "round, Regular Season - 1" "https://v3.football.api-sports.io/fixtures?league=39&season=2024&round=Regular%20Season%20-%201"
          check "single date" "https://v3.football.api-sports.io/fixtures?league=39&season=2024&date=2024-08-17"

  test-refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run refresh
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: |
          echo "RAPIDAPI_KEY is set: $([ -n "$RAPIDAPI_KEY" ] && echo yes || echo no)"
          node scripts/refresh.mjs

      - name: Report result
        run: |
          node -e '
            const d = require("./docs/data/fixtures.json");
            console.log("source:", d.source);
            console.log("fixture count:", d.fixtures.length);
            console.log("sample:", JSON.stringify(d.fixtures.slice(0, 3).map(f => ({
              league: f.league, home: f.home.name, away: f.away.name, date: f.date, combined: f.score.combined,
            })), null, 2));
          '
