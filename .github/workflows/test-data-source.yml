name: Test data source

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-historical-season:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Fetch season 2024 fixtures directly (proves auth + data shape)
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: |
          echo "== Premier League, season 2024, last 3 finished fixtures =="
          curl -s -o /tmp/hist.json -w "HTTP %{http_code}\n" \
            -H "x-apisports-key: $RAPIDAPI_KEY" \
            "https://v3.football.api-sports.io/fixtures?league=39&season=2024&last=3"
          node -e '
            const d = require("/tmp/hist.json");
            console.log("results:", d.results);
            console.log("errors:", JSON.stringify(d.errors));
            for (const r of d.response || []) {
              console.log(r.fixture.date, r.teams.home.name, r.goals.home, "-", r.goals.away, r.teams.away.name);
            }
          '

  test-refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run refresh
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: |
          echo "RAPIDAPI_KEY is set: $([ -n "$RAPIDAPI_KEY" ] && echo yes || echo no)"
          node scripts/refresh.mjs

      - name: Report result
        run: |
          node -e '
            const d = require("./docs/data/fixtures.json");
            console.log("source:", d.source);
            console.log("fixture count:", d.fixtures.length);
            console.log("sample:", JSON.stringify(d.fixtures.slice(0, 3).map(f => ({
              league: f.league, home: f.home.name, away: f.away.name, date: f.date, combined: f.score.combined,
            })), null, 2));
          '
