name: Test data source

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe-sportapi7-wider:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Sweep tournament ids 91..200 for Bundesliga
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: |
          for id in $(seq 91 200); do
            body=$(curl -s -H "x-rapidapi-key: $RAPIDAPI_KEY" -H "x-rapidapi-host: sportapi7.p.rapidapi.com" \
              "https://sportapi7.p.rapidapi.com/api/v1/tournament/$id/events/next/0")
            name=$(echo "$body" | grep -o '"tournament":{"name":"[^"]*"' | head -1)
            country=$(echo "$body" | grep -o '"category":{"name":"[^"]*"' | head -1)
            if [ -n "$name" ]; then echo "id=$id  $name  $country"; fi
            sleep 0.7
          done
          echo "done"

  test-refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run refresh
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: |
          echo "RAPIDAPI_KEY is set: $([ -n "$RAPIDAPI_KEY" ] && echo yes || echo no)"
          node scripts/refresh.mjs

      - name: Report result
        run: |
          node -e '
            const d = require("./docs/data/fixtures.json");
            console.log("source:", d.source);
            console.log("fixture count:", d.fixtures.length);
            console.log("sample:", JSON.stringify(d.fixtures.slice(0, 3).map(f => ({
              league: f.league, home: f.home.name, away: f.away.name, date: f.date, combined: f.score.combined,
            })), null, 2));
          '
