name: Test data source

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe-sportapi7:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Probe sportapi7.p.rapidapi.com
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: |
          probe() {
            echo "== $1 =="
            code=$(curl -s -o /tmp/probe.json -w "%{http_code}" \
              -H "x-rapidapi-key: $RAPIDAPI_KEY" -H "x-rapidapi-host: sportapi7.p.rapidapi.com" \
              "https://sportapi7.p.rapidapi.com$1")
            echo "HTTP $code"
            head -c 350 /tmp/probe.json; echo
            sleep 1
          }

          # Confirmed working: tournament id=1 -> Premier League via /events/next/0 (no season needed).
          # Now sweep ids to find La Liga / Bundesliga / Serie A / Ligue 1 by name, reusing that endpoint.
          echo "== checking the gap ids from 1..40 via /seasons (works even with no upcoming fixture) =="
          for id in 7 8 9 10 11 14 20 21 22 23 25 26 31 32 38 39 40; do
            body=$(curl -s -H "x-rapidapi-key: $RAPIDAPI_KEY" -H "x-rapidapi-host: sportapi7.p.rapidapi.com" \
              "https://sportapi7.p.rapidapi.com/api/v1/tournament/$id/seasons")
            name=$(echo "$body" | grep -o '"name":"[^"]*"' | head -1)
            echo "id=$id  $name"
            sleep 0.8
          done

  test-refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run refresh
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: |
          echo "RAPIDAPI_KEY is set: $([ -n "$RAPIDAPI_KEY" ] && echo yes || echo no)"
          node scripts/refresh.mjs

      - name: Report result
        run: |
          node -e '
            const d = require("./docs/data/fixtures.json");
            console.log("source:", d.source);
            console.log("fixture count:", d.fixtures.length);
            console.log("sample:", JSON.stringify(d.fixtures.slice(0, 3).map(f => ({
              league: f.league, home: f.home.name, away: f.away.name, date: f.date, combined: f.score.combined,
            })), null, 2));
          '
