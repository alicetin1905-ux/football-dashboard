name: Test data source

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe-direct-sofascore:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe api.sofascore.com directly (no key)
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36"

          echo "== reachability: unique-tournament/1 (Premier League) events/next/0 =="
          curl -s -o /tmp/p1.json -w "HTTP %{http_code}\n" -A "$UA" \
            "https://api.sofascore.com/api/v1/unique-tournament/1/events/next/0"
          head -c 300 /tmp/p1.json; echo

          echo "== reachability fallback: tournament/1 (in case path segment differs) events/next/0 =="
          curl -s -o /tmp/p1b.json -w "HTTP %{http_code}\n" -A "$UA" \
            "https://api.sofascore.com/api/v1/tournament/1/events/next/0"
          head -c 300 /tmp/p1b.json; echo

          echo "== search: Bundesliga =="
          curl -s -o /tmp/p2.json -w "HTTP %{http_code}\n" -A "$UA" \
            "https://api.sofascore.com/api/v1/search/unique-tournaments?q=Bundesliga"
          head -c 800 /tmp/p2.json; echo

          echo "== search/all: Bundesliga (alternate path) =="
          curl -s -o /tmp/p3.json -w "HTTP %{http_code}\n" -A "$UA" \
            "https://api.sofascore.com/api/v1/search/all?q=Bundesliga"
          head -c 800 /tmp/p3.json; echo

  test-refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run refresh
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: |
          echo "RAPIDAPI_KEY is set: $([ -n "$RAPIDAPI_KEY" ] && echo yes || echo no)"
          node scripts/refresh.mjs

      - name: Report result
        run: |
          node -e '
            const d = require("./docs/data/fixtures.json");
            console.log("source:", d.source);
            console.log("fixture count:", d.fixtures.length);
            console.log("sample:", JSON.stringify(d.fixtures.slice(0, 3).map(f => ({
              league: f.league, home: f.home.name, away: f.away.name, date: f.date, combined: f.score.combined,
            })), null, 2));
          '
