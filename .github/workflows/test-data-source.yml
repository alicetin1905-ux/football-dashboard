name: Test data source

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run refresh
        run: node scripts/refresh.mjs

      - name: Report result
        run: |
          node -e '
            const d = require("./docs/data/fixtures.json");
            console.log("source:", d.source);
            console.log("fixture count:", d.fixtures.length);
            const byLeague = {};
            for (const f of d.fixtures) byLeague[f.league] = (byLeague[f.league] || 0) + 1;
            console.log("by league:", JSON.stringify(byLeague));
            console.log("low-confidence count:", d.fixtures.filter(f => f.score.confidence === "low").length);
            console.log("sample:", JSON.stringify(d.fixtures.slice(0, 5).map(f => ({
              league: f.league, home: f.home.name, away: f.away.name, date: f.date,
              combined: f.score.combined, confidence: f.score.confidence,
            })), null, 2));
          '
