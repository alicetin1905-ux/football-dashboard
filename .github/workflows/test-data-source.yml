name: Test data source

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-turkish-league:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: List all competitions, search for Turkey
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: |
          curl -s -H "X-Auth-Token: $FOOTBALL_DATA_TOKEN" \
            "https://api.football-data.org/v4/competitions" -o /tmp/comps.json
          node -e '
            const d = require("/tmp/comps.json");
            const hits = (d.competitions || []).filter(c =>
              c.area?.name === "Turkey" || /s.per lig/i.test(c.name || ""));
            console.log("total competitions listed:", d.competitions?.length);
            console.log("Turkey matches:", JSON.stringify(hits, null, 2));
            console.log("all competitions:", (d.competitions || []).map(c => `${c.code} - ${c.name} (${c.area?.name})`).join("\n"));
          '

  test-refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run refresh
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: |
          echo "FOOTBALL_DATA_TOKEN is set: $([ -n "$FOOTBALL_DATA_TOKEN" ] && echo yes || echo no)"
          node scripts/refresh.mjs

      - name: Report result
        run: |
          node -e '
            const d = require("./docs/data/fixtures.json");
            console.log("source:", d.source);
            console.log("fixture count:", d.fixtures.length);
            console.log("date range:", d.fixtures.at(-1)?.date, "to", d.fixtures[0]?.date);
            console.log("low-confidence count:", d.fixtures.filter(f => f.score.confidence === "low").length);
            console.log("sample:", JSON.stringify(d.fixtures.slice(0, 5).map(f => ({
              league: f.league, home: f.home.name, away: f.away.name, date: f.date,
              combined: f.score.combined, confidence: f.score.confidence,
              sampleHome: f.score.sampleHome, sampleAway: f.score.sampleAway,
            })), null, 2));
          '
